collections:
  app:
    output: true
    permalink: /:path/
  gdpr:
    output: true
    permalink: /:path/
  localization:
    output: true
    permalink: /:path/
    
defaults:
  -
    scope:
      path: ""
      type: "app"
    values:
      layout: "app"
  -
    scope:
      path: ""
      type: "gdpr"
    values:
      layout: "gdpr"
  -
    scope:
      path: ""
      type: "localization"
    values:
      layout: "localization"